<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sabse Zyada Kaun? - Diwali Party Game</title>
<style>
  @font-face { font-family: 'Baloo2'; src: url('./baloo2-bold.ttf') format('truetype'); font-weight: 700; }
  @font-face { font-family: 'Baloo2'; src: url('./baloo2-extrabold.ttf') format('truetype'); font-weight: 800; }
  @font-face { font-family: 'Lilita'; src: url('./lilita-one.ttf') format('truetype'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Baloo2', 'Comic Sans MS', cursive, sans-serif;
    background: radial-gradient(ellipse at 50% 120%, #3b1a5e 0%, #1a0b2e 45%, #0d0518 100%);
    color: #fff4e6;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    user-select: none; -webkit-user-select: none;
    cursor: pointer;
    padding: clamp(10px, 2.5vh, 28px) clamp(14px, 3vw, 48px);
    position: relative;
  }

  /* floating sparks */
  .spark { position: fixed; bottom: -10vh; pointer-events: none; z-index: 0;
    animation: floatUp linear infinite; opacity: 0; filter: drop-shadow(0 0 6px #ffb347); }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: .9; }
    90% { opacity: .7; }
    100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
  }

  header { text-align: center; z-index: 2; }
  .kicker {
    font-family: 'Lilita', 'Baloo2', cursive;
    font-size: clamp(13px, 2.2vh, 22px);
    letter-spacing: .35em; text-transform: uppercase;
    color: #ffb347; opacity: .9;
  }
  h1 {
    font-family: 'Lilita', 'Baloo2', cursive;
    font-size: clamp(34px, 8vh, 92px);
    line-height: 1.05;
    background: linear-gradient(180deg, #ffe9b0 0%, #ffd27a 35%, #ff9a3d 75%, #ff7a33 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 14px rgba(255, 122, 51, .35));
    margin-top: .5vh;
  }

  .stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; z-index: 2; perspective: 1200px; min-height: 0; }

  .card {
    width: min(1100px, 92vw);
    text-align: center;
    padding: clamp(18px, 4vh, 48px) clamp(18px, 4vw, 64px);
    border-radius: clamp(18px, 3vh, 36px);
    background: linear-gradient(160deg, rgba(255,210,122,.10), rgba(255,122,51,.06) 60%, rgba(255,255,255,.03));
    border: 2px solid rgba(255, 210, 122, .45);
    box-shadow: 0 0 40px rgba(255, 154, 61, .18), inset 0 0 60px rgba(255, 210, 122, .05);
    backdrop-filter: blur(2px);
    transition: transform .38s cubic-bezier(.2,.9,.25,1.2), opacity .3s ease;
  }
  .card.out { transform: translateY(-6vh) rotateX(55deg) scale(.85); opacity: 0; }
  .card.prep { transform: translateY(6vh) rotateX(-55deg) scale(.85); opacity: 0; transition: none; }
  .card .label {
    font-family: 'Lilita', cursive;
    font-size: clamp(14px, 2.6vh, 26px);
    letter-spacing: .25em; text-transform: uppercase;
    color: #ffcf8a; margin-bottom: 1.5vh;
  }
  .card .q {
    font-weight: 800;
    font-size: clamp(26px, 6.2vh, 68px);
    line-height: 1.22;
    color: #fff4e6;
    text-shadow: 0 2px 18px rgba(0,0,0,.45);
  }

  .card.patakha {
    border-color: #ff6b6b;
    background: linear-gradient(160deg, rgba(255,107,107,.16), rgba(255,122,51,.10) 55%, rgba(255,210,122,.05));
    box-shadow: 0 0 60px rgba(255, 107, 107, .30), inset 0 0 60px rgba(255,107,107,.08);
  }
  .card.patakha .label { color: #ff8f8f; }

  footer { text-align: center; z-index: 2; }
  .hint { font-weight: 700; font-size: clamp(15px, 2.6vh, 26px); color: #ffd27a; opacity: .95; }
  .hint .arrow { display: inline-block; animation: nudge 1.1s ease-in-out infinite; }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
  .counter { margin-top: .8vh; font-size: clamp(12px, 1.9vh, 18px); color: #c9ab7f; letter-spacing: .12em; }

  .burst { position: fixed; z-index: 5; pointer-events: none; font-size: clamp(28px, 5vh, 52px);
    animation: pop 900ms ease-out forwards; }
  @keyframes pop {
    0% { transform: translate(0,0) scale(.4) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(var(--rot)); opacity: 0; }
  }
</style>
</head>
<body>
  <header>
    <div class="kicker">दिमाग की आतिशबाज़ी · after-party</div>
    <h1>Sabse Zyada Kaun?</h1>
  </header>

  <div class="stage">
    <div class="card" id="card">
      <div class="label" id="label">Sabse zyada likely kaun...</div>
      <div class="q" id="q">Loading...</div>
    </div>
  </div>

  <footer>
    <div class="hint">Sab ek saath POINT karo <span class="arrow">👉</span> phir kahin bhi tap karo</div>
    <div class="counter" id="counter"></div>
  </footer>

<script>
const MAIN = [
  "Kaun sabse pehle dance floor pe naachega?",
  "Kaun aaj sabse zyada selfies lega?",
  "Kaun 'bas ek aur game' bol ke party 3 baje tak kheenchega?",
  "Kaun patakhe ki awaaz pe sabse zyada chowk jaata hai?",
  "Kaun group photo mein hamesha aankhein band rakhta hai?",
  "Kaun kal subah sabse late uthega?",
  "Kaun mid-party mein stock market check karega?",
  "Kaun 'bhai bas ek photo' sabse zyada bolega?",
  "Kaun soan papdi ka poora dabba akele khatam kar sakta hai?",
  "Kaun playlist hijack karke apne gaane lagayega?",
  "Kaun 'trust me bro' bol ke sabse galat advice dega?",
  "Kaun sofe pe party ke beech hi so jayega?",
  "Kaun laddoo kha ke 'diet kal se pakka' bolega?",
  "Kaun sabse dramatic reaction dega jab uska naam aayega?",
  "Kaun bina bataye fridge ka last dessert kha jayega?",
  "Kaun antakshari mein wahi gaana teesri baar gaayega?",
  "Kaun Diwali forward ko 'personal message' samajh ke emotional ho jayega?",
  "Kaun 'yaar ab ghar chalein?' bol ke sabse aakhir tak rukega?",
  "Kaun rangoli ko 'abstract art' bol ke nikal lega?",
  "Kaun cheating karte hue sabse pehle pakda jayega?",
  "Kaun har photo mein apna 'good side' dhoondhega?",
  "Kaun quiz haar ke 'questions hi galat the' bolega?",
  "Kaun 2 minute mein stranger se best friend ban jayega?",
  "Kaun 'main toh bas dekh raha hoon' bol ke sab kuch kha jayega?",
  "Kaun sabse pehle 'Cheers!' bolega aur glass sabse aakhir mein uthayega?",
  "Kaun is game ka unofficial referee ban jayega?"
];
const PATAKHA = [
  "Sabko apna signature Diwali dance move dikhao. 10 seconds each. Go!",
  "Rapid fire: har banda ek Diwali gaana. Jo atka, woh host ka waiter agle 10 minute!",
  "Sab apni sabse FILMY 'Happy Diwali' wish do. Best performance ko zor se taali!",
  "15 second mein sabse funny group selfie pose. Majority vote se winner!",
  "Har banda apni sabse badi Diwali fail story - sirf EK line mein!"
];
const LABELS = ["Sabse zyada likely kaun...", "Point karo, point karo...", "Sach bolna padega...", "Kaun hai woh shaks?"];
const EMOJI = ["🪔","🎆","🧨","✨","🎇","🥳"];

function shuffled(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }

let deck = [], idx = -1, round = 1, locked = false;
const card = document.getElementById('card');
const q = document.getElementById('q');
const label = document.getElementById('label');
const counter = document.getElementById('counter');

function buildDeck(){
  const mains = shuffled(MAIN).map(t => ({t, patakha:false}));
  const bonus = shuffled(PATAKHA).map(t => ({t, patakha:true}));
  deck = [];
  // sprinkle one patakha card roughly every 5-6 mains
  let bi = 0;
  mains.forEach((m, i) => {
    deck.push(m);
    if (bi < bonus.length && (i % 5 === 4)) deck.push(bonus[bi++]);
  });
  while (bi < bonus.length) deck.push(bonus[bi++]);
}

function burst(n){
  for (let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className = 'burst';
    s.textContent = EMOJI[Math.floor(Math.random()*EMOJI.length)];
    s.style.left = (35 + Math.random()*30) + 'vw';
    s.style.top = (35 + Math.random()*25) + 'vh';
    s.style.setProperty('--dx', (Math.random()*40-20)+'vw');
    s.style.setProperty('--dy', (-(15+Math.random()*30))+'vh');
    s.style.setProperty('--rot', (Math.random()*360-180)+'deg');
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 950);
  }
}

function render(){
  const item = deck[idx];
  const done = idx >= deck.length;
  card.classList.toggle('patakha', !done && item.patakha);
  if (done){
    label.textContent = "Khatam!";
    q.textContent = "Party abhi baki hai. Tap karo - phir se shuffle!";
    counter.textContent = deck.length + " / " + deck.length + " · round " + round + " done";
  } else {
    label.textContent = item.patakha ? "🧨 PATAKHA CARD 🧨" : LABELS[Math.floor(Math.random()*LABELS.length)];
    q.textContent = item.t;
    counter.textContent = (idx+1) + " / " + deck.length + (round>1 ? " · round " + round : "");
  }
}

function next(){
  if (locked) return;
  locked = true;
  setTimeout(()=>locked=false, 420);
  idx++;
  if (idx > deck.length){ round++; idx = 0; buildDeck(); }
  card.classList.add('out');
  setTimeout(()=>{
    render();
    card.classList.add('prep');
    card.classList.remove('out');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      card.classList.remove('prep');
      const item = deck[idx];
      if (idx < deck.length && item.patakha) burst(10);
      else if (Math.random() < .22) burst(4);
    }));
  }, 320);
}

let lastTouch = 0;
document.addEventListener('click', () => { if (Date.now() - lastTouch > 700) next(); });
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ e.preventDefault(); next(); }
});
document.addEventListener('touchend', e => { e.preventDefault(); lastTouch = Date.now(); next(); }, {passive:false});

// ambient floating diyas/sparks
for (let i=0;i<10;i++){
  const s = document.createElement('div');
  s.className = 'spark';
  s.textContent = Math.random() < .5 ? "🪔" : "✨";
  s.style.left = Math.random()*100 + 'vw';
  s.style.fontSize = (14 + Math.random()*22) + 'px';
  s.style.animationDuration = (9 + Math.random()*10) + 's';
  s.style.animationDelay = (Math.random()*12) + 's';
  document.body.appendChild(s);
}

buildDeck();
idx = 0;
card.classList.add('prep');
render();
requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.remove('prep')));
</script>
</body>
</html>
